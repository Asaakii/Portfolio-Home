<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Neon blog dashboard</title>
  <desc id="desc">Dark portfolio blog dashboard with cyan panels and pink accent light.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#123b7a"/>
      <stop offset=".42" stop-color="#071537"/>
      <stop offset="1" stop-color="#02050d"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#122b5e"/>
      <stop offset="1" stop-color="#071225"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g opacity=".55" filter="url(#glow)">
    <path d="M0 245 C300 190 512 420 800 338 C1120 246 1290 128 1600 168" fill="none" stroke="#7ecbff" stroke-width="8"/>
    <path d="M120 708 C410 550 650 760 945 596 C1190 460 1360 470 1540 380" fill="none" stroke="#ff4fb6" stroke-width="6"/>
  </g>
  <g transform="translate(150 130)">
    <rect width="480" height="620" rx="34" fill="#050913" opacity=".92"/>
    <rect x="42" y="48" width="180" height="18" rx="9" fill="#f5f7ff"/>
    <rect x="42" y="94" width="390" height="12" rx="6" fill="#4f6387"/>
    <rect x="42" y="145" width="390" height="210" rx="24" fill="url(#panel)" stroke="#40b8ff" stroke-opacity=".45"/>
    <rect x="76" y="390" width="320" height="16" rx="8" fill="#f5f7ff"/>
    <rect x="76" y="430" width="230" height="10" rx="5" fill="#5c6d93"/>
    <rect x="76" y="458" width="288" height="10" rx="5" fill="#5c6d93"/>
    <rect x="76" y="510" width="130" height="46" rx="23" fill="#168bff"/>
  </g>
  <g transform="translate(720 190)">
    <rect width="560" height="410" rx="34" fill="#06101f" opacity=".9" stroke="#ffffff" stroke-opacity=".08"/>
    <rect x="50" y="52" width="178" height="16" rx="8" fill="#e6f2ff"/>
    <rect x="50" y="108" width="460" height="180" rx="22" fill="#0a1c3d"/>
    <path d="M82 236 L160 172 L226 212 L304 134 L430 246" fill="none" stroke="#7ecbff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <circle cx="430" cy="246" r="16" fill="#ff58b7" filter="url(#glow)"/>
    <rect x="50" y="324" width="160" height="12" rx="6" fill="#687a9c"/>
    <rect x="238" y="324" width="160" height="12" rx="6" fill="#687a9c"/>
  </g>
  <g opacity=".32">
    <circle cx="1358" cy="162" r="72" fill="#68d7ff"/>
    <circle cx="1406" cy="206" r="112" fill="#e84fb6"/>
  </g>
</svg>
