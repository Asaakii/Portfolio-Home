<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Neon image gallery</title>
  <desc id="desc">Dark gallery grid with luminous image thumbnails and color beams.</desc>
  <defs>
    <radialGradient id="bg" cx="48%" cy="45%" r="70%">
      <stop offset="0" stop-color="#18286a"/>
      <stop offset=".48" stop-color="#080d26"/>
      <stop offset="1" stop-color="#03040b"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g filter="url(#glow)" opacity=".62">
    <path d="M-40 280 L520 150" stroke="#72d8ff" stroke-width="7"/>
    <path d="M980 90 L1680 300" stroke="#ff4fb6" stroke-width="7"/>
    <path d="M210 820 L1240 500" stroke="#5f8dff" stroke-width="5"/>
  </g>
  <g transform="translate(170 118)">
    <rect width="1160" height="610" rx="36" fill="#050914" opacity=".9"/>
    <rect x="60" y="58" width="264" height="16" rx="8" fill="#f4f8ff"/>
    <rect x="60" y="102" width="420" height="10" rx="5" fill="#516991"/>
    <g transform="translate(60 160)">
      <rect width="300" height="200" rx="22" fill="#102452" stroke="#72d8ff" stroke-opacity=".42"/>
      <rect x="340" width="300" height="200" rx="22" fill="#271044" stroke="#ff4fb6" stroke-opacity=".42"/>
      <rect x="680" width="300" height="200" rx="22" fill="#092a40" stroke="#72d8ff" stroke-opacity=".42"/>
      <rect y="240" width="300" height="200" rx="22" fill="#260f38" stroke="#ff4fb6" stroke-opacity=".42"/>
      <rect x="340" y="240" width="300" height="200" rx="22" fill="#0c2b56" stroke="#72d8ff" stroke-opacity=".42"/>
      <rect x="680" y="240" width="300" height="200" rx="22" fill="#111b4b" stroke="#ff4fb6" stroke-opacity=".42"/>
      <g fill="none" stroke-width="6" filter="url(#glow)">
        <path d="M34 162 L116 92 L178 132 L260 62" stroke="#72d8ff"/>
        <path d="M374 154 L452 82 L518 132 L606 56" stroke="#ff70c7"/>
        <path d="M714 166 L788 90 L854 128 L938 66" stroke="#72d8ff"/>
        <path d="M34 402 L124 310 L204 372 L268 300" stroke="#ff70c7"/>
        <path d="M374 394 L448 330 L518 360 L600 292" stroke="#72d8ff"/>
        <path d="M714 410 L790 308 L864 366 L942 288" stroke="#ff70c7"/>
      </g>
    </g>
  </g>
</svg>
