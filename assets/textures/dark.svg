<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="none">
  <defs>
    <radialGradient id="shade" cx="50%" cy="50%" r="58%">
      <stop offset="0" stop-color="#111827" stop-opacity=".8"/>
      <stop offset=".55" stop-color="#050913" stop-opacity=".38"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1" fill="#ffffff" opacity=".12"/>
      <circle cx="17" cy="13" r=".8" fill="#7ecbff" opacity=".08"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#shade)"/>
  <rect width="800" height="500" fill="url(#dots)" opacity=".35"/>
</svg>
