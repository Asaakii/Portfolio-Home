<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>能力星图 — Asaakii</title>
    <meta name="description" content="Asaakii 的个人能力星图：摄影、吉他、音乐制作、直播、登山、徒步、潜水、Vibe Coding、硬件开发、软件开发。" />
    <meta name="theme-color" content="#050712" />
    <link rel="icon" href="https://img-asaakii-top.oss-cn-shanghai.aliyuncs.com/img/avatar2.png" />
    <script type="module" crossorigin src="/skills/assets/index-DHpTBdOO.js"></script>
    <link rel="stylesheet" crossorigin href="/skills/assets/index-CurdoRrN.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        var msg = null;
        try {
          var canvas = document.createElement('canvas');
          if (!canvas.getContext('webgl2') && !canvas.getContext('webgl')) {
            msg = '此设备或浏览器没有可用的 WebGL，无法渲染能力星图。请换用支持 WebGL 的浏览器，或检查显卡/远程桌面设置。';
          }
        } catch (error) {
          msg = '此设备或浏览器没有可用的 WebGL，无法渲染能力星图。';
        }
        if (msg) {
          window.__ASA_SKILLS_UNSUPPORTED__ = true;
          document.getElementById('root').innerHTML =
            '<div style="display:flex;min-height:100vh;align-items:center;justify-content:center;background:#050712;color:#f2d899;font-family:serif;padding:24px;text-align:center">' +
            '<div><div style="font-size:34px;letter-spacing:.16em;margin-bottom:14px">能力星图</div>' +
            '<div style="font-size:14px;line-height:1.8;max-width:32em;color:#b9c2d6">' + msg + '</div></div></div>';
        }
      })();
    </script>
  </body>
</html>
